<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Issue Board — Indian IPO Tracker</title>
<meta name="description" content="Live tracker for Indian IPOs — subscription heat, GMP, price bands and listing dates for NSE & BSE issues." />
<meta name="theme-color" content="#0B0E1E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E1E;--text:#EEF0FB;--muted:#8C93B5;--faint:#5B6285;
    --glass:rgba(255,255,255,.05);--edge:rgba(255,255,255,.1);--edge-hi:rgba(255,255,255,.2);
    --violet:#8B6CFF;--cyan:#3FD6E4;--green:#2EE6A8;--red:#FF5C7A;--gold:#F5C452;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Outfit',system-ui,sans-serif;color:var(--text);line-height:1.55;
    background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:2}

  .orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
  .orb.o1{width:480px;height:480px;background:#4A2FBF;top:-140px;left:-120px;animation:drift1 26s ease-in-out infinite alternate}
  .orb.o2{width:380px;height:380px;background:#0E5F63;bottom:-100px;right:-80px;animation:drift2 32s ease-in-out infinite alternate}
  .orb.o3{width:260px;height:260px;background:#7A3B8F;top:40%;left:60%;animation:drift3 38s ease-in-out infinite alternate;opacity:.22}
  @keyframes drift1{to{transform:translate(90px,60px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-70px,-50px) scale(1.1)}}
  @keyframes drift3{to{transform:translate(-120px,40px)}}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(11,14,30,.65);backdrop-filter:blur(16px);border-bottom:1px solid var(--edge)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .logo{font-weight:800;font-size:17px}
  .logo .tick{color:var(--violet)}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center}
  .stamp .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .hero{padding:52px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap}
  .hero h1{font-weight:800;font-size:clamp(28px,5vw,48px);line-height:1.08;letter-spacing:-0.03em;max-width:16ch}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin-top:12px;max-width:48ch;font-size:15px}

  .scene{width:140px;height:140px;perspective:700px;flex-shrink:0}
  .cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 14s linear infinite}
  @keyframes spin{from{transform:rotateX(-18deg) rotateY(0)}to{transform:rotateX(-18deg) rotateY(360deg)}}
  .face{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:48px;border:1px solid var(--edge-hi);border-radius:16px;
    background:linear-gradient(135deg,rgba(139,108,255,.16),rgba(63,214,228,.08));
  }
  .face span{background:linear-gradient(135deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .face.f{transform:translateZ(70px)} .face.b{transform:rotateY(180deg) translateZ(70px)}
  .face.l{transform:rotateY(-90deg) translateZ(70px)} .face.r{transform:rotateY(90deg) translateZ(70px)}
  .face.t{transform:rotateX(90deg) translateZ(70px)} .face.d{transform:rotateX(-90deg) translateZ(70px)}

  .pills{display:flex;gap:8px;padding:28px 0 22px;flex-wrap:wrap}
  .pills button{
    appearance:none;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;
    color:var(--muted);background:var(--glass);border:1px solid var(--edge);
    border-radius:99px;padding:8px 17px;transition:all .2s ease;
  }
  .pills button:hover{border-color:var(--edge-hi);color:var(--text);transform:translateY(-2px)}
  .pills button[aria-selected="true"]{background:linear-gradient(90deg,var(--violet),#6A4DE0);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(139,108,255,.35)}
  .pills button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .pills .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

  /* ── Horizontal row cards ── */
  main{padding-bottom:90px;perspective:1600px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .card{
    background:linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
    border:1px solid var(--edge);border-radius:20px;
    display:grid;grid-template-columns:1.45fr 1.05fr 1.15fr;
    transform-style:preserve-3d;will-change:transform;
    transition:box-shadow .25s ease;position:relative;overflow:hidden;
    opacity:0;transform:translateY(22px);
  }
  .card.in{animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .card:hover{box-shadow:0 22px 55px rgba(0,0,0,.5),0 0 0 1px var(--edge-hi)}
  .card .glare{
    position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s ease;
    background:radial-gradient(500px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.12),transparent 55%);
  }
  .card:hover .glare{opacity:1}

  .sec{padding:20px 22px;min-width:0}
  .sec + .sec{border-left:1px solid var(--edge)}
  .sec-label{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}

  /* Zone 1: identity */
  .co-name{font-weight:700;font-size:19px;letter-spacing:-0.01em;line-height:1.25}
  .co-meta{font-size:12.5px;color:var(--muted);margin-top:5px}
  .chips{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;border-radius:99px;padding:4px 10px;white-space:nowrap}
  .chip.open{background:rgba(46,230,168,.12);color:var(--green);border:1px solid rgba(46,230,168,.3)}
  .chip.upcoming{background:rgba(245,196,82,.12);color:var(--gold);border:1px solid rgba(245,196,82,.3)}
  .chip.listed{background:var(--glass);color:var(--muted);border:1px solid var(--edge)}
  .chip.sme{background:none;border:1px dashed var(--edge-hi);color:var(--faint)}
  .chip.cd{background:rgba(139,108,255,.14);color:var(--violet);border:1px solid rgba(139,108,255,.35)}

  /* Zone 2: pulse */
  .big{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
  .big .x{font-weight:800;font-size:38px;line-height:1;letter-spacing:-0.03em;color:var(--green);text-shadow:0 0 26px rgba(46,230,168,.4)}
  .big .x.cold{color:var(--red);text-shadow:0 0 26px rgba(255,92,122,.35)}
  .big .x.wait{color:var(--faint);font-size:25px;text-shadow:none}
  .big .x.pop{color:var(--gold);text-shadow:0 0 26px rgba(245,196,82,.35)}
  .big .cap{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
  /* Subscription heat tiles: QIB / bHNI / sHNI / Retail, 2x2 solid wash */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
  .tile{border-radius:12px;padding:11px 13px;border:1px solid rgba(255,255,255,.07)}
  .tile .t-n{font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;line-height:1.1;color:var(--green)}
  .tile .t-n.cold{color:var(--red)}
  .tile .t-n.na{color:var(--faint);font-family:'Outfit',sans-serif;font-size:16px}
  .tile .t-k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .tile .t-c{font-family:var(--mono);font-size:10px;color:var(--cyan);margin-top:5px}
  .tile .t-c b{font-weight:700}
  .t-foot{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .t-foot b{color:var(--text);font-weight:600}
  .meter{display:flex;flex-direction:column;gap:6px}
  .m-row{display:grid;grid-template-columns:36px 1fr 52px;gap:9px;align-items:center}
  .m-row .cat{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em}
  .m-row .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .m-row .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .m-row .fill.under{background:linear-gradient(90deg,#B23,var(--red))}
  .m-row .v{font-family:var(--mono);font-size:11.5px;font-weight:700;text-align:right}
  .m-row .v.under{color:var(--red)}

  /* Zone 3: facts 2x2 */
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .fact .k{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
  .fact .v{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:3px}
  .fact .s{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
  .fact .gmp{color:var(--green)}
  .fact .est{color:var(--cyan)}

  /* Zone 1 add-on: horizontal milestone stepper */
  .tlh{display:flex;align-items:flex-start;margin-top:16px;max-width:340px}
  .tlh-step{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:50px}
  .tlh-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--faint);background:var(--bg)}
  .tlh-step.done .tlh-dot{border-color:var(--green);background:var(--green)}
  .tlh-step.now .tlh-dot{border-color:var(--violet);background:var(--violet);box-shadow:0 0 10px rgba(139,108,255,.7)}
  .tlh-line{flex:1;height:2px;background:var(--edge);margin-top:5px;min-width:14px}
  .tlh-line.done{background:rgba(46,230,168,.45)}
  .tlh-k{font-family:var(--mono);font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
  .tlh-v{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted)}
  .tlh-step.done .tlh-v{color:var(--text)}
  .tlh-step.now .tlh-k,.tlh-step.now .tlh-v{color:var(--violet)}

  .empty{text-align:center;color:var(--muted);padding:70px 20px;border:1px dashed var(--edge-hi);border-radius:20px}
  footer{border-top:1px solid var(--edge);padding:24px 0 46px;font-size:12.5px;color:var(--faint);position:relative;z-index:2}
  footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

  @media (max-width:960px){
    .card{grid-template-columns:1fr 1fr}
    .sec{border-left:none;border-top:1px solid var(--edge)}
    .sec.who{grid-column:1/-1;border-top:none}
    .sec:last-of-type{border-left:1px solid var(--edge)}
  }
  @media (max-width:600px){
    .scene{display:none}
    .card{grid-template-columns:1fr}
    .sec{border-left:none!important;border-top:1px solid var(--edge)}
    .sec.who{border-top:none}
    .tlh{max-width:none}
  }
  @media (prefers-reduced-motion:reduce){
    .orb,.cube,.stamp .dot{animation:none!important}
    .card{opacity:1;transform:none}
    .card.in{animation:none}
    .m-row .fill{transition:none}
    .pills button:hover{transform:none}
  }
</style>
</head>
<body>

<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<div class="topbar"><div class="wrap">
  <div class="logo">Issue<span class="tick">▲</span>Board</div>
  <div class="stamp" id="stamp"><span class="dot"></span>loading…</div>
</div></div>

<div class="wrap">
  <section class="hero">
    <div>
      <h1>Indian IPOs, <em>in another dimension.</em></h1>
      <p>Subscription heat, grey-market premium, price bands and key dates — every NSE &amp; BSE issue, refreshed through the trading day.</p>
    </div>
    <div class="scene" aria-hidden="true">
      <div class="cube">
        <div class="face f"><span>₹</span></div><div class="face b"><span>▲</span></div>
        <div class="face l"><span>×</span></div><div class="face r"><span>%</span></div>
        <div class="face t"><span>◆</span></div><div class="face d"><span>₹</span></div>
      </div>
    </div>
  </section>
  <nav class="pills" role="tablist" aria-label="Filter IPOs" id="pills"></nav>
  <main><div class="stack" id="stack" aria-live="polite"></div></main>
</div>

<footer><div class="wrap">
  <span>GMP is an unofficial grey-market indication — not investment advice.</span>
  <span style="font-family:var(--mono)" id="footStamp"></span>
</div></footer>

<script>
const fmtINR = n => "₹" + n.toLocaleString("en-IN");
const fmtDate = iso => iso ? new Date(iso+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}) : null;
const TABS=[{key:"open",label:"Open now"},{key:"upcoming",label:"Upcoming"},{key:"listed",label:"Listed"}];
let DATA=null, active="open";
const daysTo = iso => Math.ceil((new Date(iso+"T17:00:00+05:30")-Date.now())/86400000);
const todayISO = () => new Date().toISOString().slice(0,10);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;

async function load(){
  try{
    DATA = window.__IPO_DATA__ || await (await fetch("./data/ipos.json",{cache:"no-store"})).json();
    const t = "Updated " + new Date(DATA.lastUpdated).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) + " IST";
    document.getElementById("stamp").innerHTML='<span class="dot"></span>'+t;
    document.getElementById("footStamp").textContent=t+(DATA.source==="sample-data"?" · sample data":"");
    renderPills(); render();
  }catch(e){
    document.getElementById("stack").innerHTML='<div class="empty">Could not load data/ipos.json — serve over HTTP.</div>';
  }
}
function renderPills(){
  const el=document.getElementById("pills"); el.innerHTML="";
  TABS.forEach(t=>{
    const n=DATA.ipos.filter(i=>i.status===t.key).length;
    const b=document.createElement("button");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected",String(t.key===active));
    b.innerHTML=t.label+'<span class="n">'+n+'</span>';
    b.onclick=()=>{active=t.key;renderPills();render();};
    el.appendChild(b);
  });
}

/* Zone 2: subscription pulse / listing outcome */
function pulseHTML(ipo){
  if(ipo.status==="listed"&&ipo.listing){
    const g=ipo.listing.gainPct;
    return '<div class="sec"><div class="sec-label">Outcome</div><div class="big"><span class="x '+(g>=0?"pop":"cold")+'" data-count="'+g+'" data-suffix="%" data-prefix="'+(g>=0?"+":"")+'">0%</span><span class="cap">listing gain</span></div>'+
      '<div class="t-foot">'+fmtINR(ipo.listing.issuePrice)+' → <b>'+fmtINR(ipo.listing.listPrice)+'</b></div></div>';
  }
  if(ipo.status==="listed"){
    return '<div class="sec"><div class="sec-label">Outcome</div><div class="big"><span class="x wait">Listed</span><span class="cap">'+(fmtDate(ipo.listingDate)||"gain data pending")+'</span></div></div>';
  }
  const sub=ipo.subscription||{};
  const has=k=>typeof sub[k]==="number";
  if(ipo.status==="upcoming"||(!has("bnii")&&!has("snii")&&!has("retail")&&!has("nii")&&!has("total"))){
    if(ipo.status==="open"){
      return '<div class="sec"><div class="sec-label">Subscription</div><div class="big"><span class="x wait">Open</span><span class="cap">numbers pending</span></div></div>';
    }
    const d=ipo.openDate?daysTo(ipo.openDate):null;
    return '<div class="sec"><div class="sec-label">Subscription</div><div class="big"><span class="x wait">'+(d!=null&&d>0?"T−"+d:"soon")+'</span><span class="cap">to open</span></div></div>';
  }
  // Heat tiles: QIB / bHNI / sHNI / Retail in fixed positions. Tint intensity is
  // log-relative to the card's hottest category (no fake "100%" range).
  // Allotment chance = min(100, 100/subscription), capped for undersubscribed.
  const cells=[["QIB","qib"],["bHNI","bnii"],["sHNI","snii"],["Retail","retail"]];
  // If the bHNI/sHNI split is missing but combined NII exists, show NII in bHNI's slot.
  if(!has("bnii")&&!has("snii")&&has("nii")){ cells[1]=["NII","nii"]; cells[2]=["sHNI","snii"]; }
  const shown=cells.filter(([l,k])=>has(k)).map(([l,k])=>sub[k]).filter(v=>v>=1);
  const maxLog=Math.log(Math.max(2,...(shown.length?shown:[2])));
  const chanceTxt=v=>{
    const c=Math.min(100,100/v);
    return c>=99.5?"100%":c>=10?c.toFixed(0)+"%":c.toFixed(1)+"%";
  };
  const tiles='<div class="tiles">'+cells.map(([lbl,key])=>{
    if(!has(key)) return '<div class="tile"><div class="t-n na">—</div><div class="t-k">'+lbl+'</div></div>';
    const v=sub[key];
    const dec=v>=100?0:v>=10?1:2;
    let style,ncls="";
    if(v<1){
      const a=(.14+(1-v)*.18).toFixed(2);
      style='background:rgba(255,92,122,'+a+')'; ncls=" cold";
    }else{
      const a=(.10+.26*Math.min(1,Math.log(Math.max(v,1.01))/maxLog)).toFixed(2);
      style='background:rgba(46,230,168,'+a+')';
    }
    return '<div class="tile" style="'+style+'"><div class="t-n'+ncls+'" data-count="'+v+'" data-dec="'+dec+'" data-suffix="×">0×</div>'+
      '<div class="t-k">'+lbl+'</div>'+
      '<div class="t-c">odds ≈ <b>'+chanceTxt(v)+'</b></div></div>';
  }).join("")+'</div>';
  return '<div class="sec"><div class="sec-label">Subscription · allotment odds</div>'+tiles+'</div>';
}

/* Zone 3: facts incl. estimated listing */
function factsHTML(ipo){
  const bandTxt=ipo.priceBand&&ipo.priceBand.max?(ipo.priceBand.min===ipo.priceBand.max?fmtINR(ipo.priceBand.max):fmtINR(ipo.priceBand.min)+'–'+fmtINR(ipo.priceBand.max)):'—';
  const minAmt=(ipo.priceBand?.max||0)*(ipo.lotSize||0);
  const lotTxt=ipo.lotSize?ipo.lotSize+' sh · '+fmtINR(minAmt):'—';
  const sizeTxt=ipo.issueSizeCr?'₹'+ipo.issueSizeCr.toLocaleString("en-IN")+' Cr':'—';
  let gmpTxt='—', estTxt='';
  if(ipo.gmp!=null&&ipo.priceBand&&ipo.priceBand.max){
    const est=ipo.priceBand.max+ipo.gmp, pct=(ipo.gmp/ipo.priceBand.max*100).toFixed(1);
    gmpTxt='<span class="gmp">+'+fmtINR(ipo.gmp)+' ('+pct+'%)</span>';
    estTxt='<div class="s est">est. list '+fmtINR(est)+'</div>';
  }
  return '<div class="sec"><div class="sec-label">Issue facts</div><div class="facts">'+
    '<div class="fact"><div class="k">Price band</div><div class="v">'+bandTxt+'</div></div>'+
    '<div class="fact"><div class="k">Lot · Min</div><div class="v">'+lotTxt+'</div></div>'+
    '<div class="fact"><div class="k">Issue size</div><div class="v">'+sizeTxt+'</div></div>'+
    '<div class="fact"><div class="k">GMP</div><div class="v">'+gmpTxt+'</div>'+estTxt+'</div>'+
  '</div></div>';
}

/* Horizontal milestone stepper (lives inside the Issue zone) */
function timelineHTML(ipo){
  const today=todayISO();
  const steps=[
    ["Opens", ipo.openDate],
    ["Closes", ipo.closeDate],
    ["Allot", ipo.allotmentDate],
    ["Lists", ipo.listingDate],
  ];
  if(!steps.some(([k,d])=>d)) return "";
  let nowIdx=steps.findIndex(([k,d])=>d&&d>=today);
  if(ipo.status==="listed") nowIdx=-2; // all done
  const state=i=>{
    const d=steps[i][1];
    if(nowIdx===-2||(d&&d<today)) return "done";
    if(i===nowIdx) return "now";
    return "future";
  };
  return '<div class="tlh">'+steps.map(([k,d],i)=>{
    const s=state(i);
    const line=i<steps.length-1?'<span class="tlh-line'+(state(i)==="done"&&state(i+1)!=="future"?" done":"")+'"></span>':'';
    return '<span class="tlh-step '+s+'"><span class="tlh-dot"></span><span class="tlh-k">'+k+'</span><span class="tlh-v">'+(fmtDate(d)||'TBA')+'</span></span>'+line;
  }).join("")+'</div>';
}

function render(){
  const stack=document.getElementById("stack");
  const rows=DATA.ipos.filter(i=>i.status===active);
  if(active==="open") rows.sort((a,b)=>(a.closeDate??"9999").localeCompare(b.closeDate??"9999"));
  if(active==="upcoming") rows.sort((a,b)=>(a.openDate??"9999").localeCompare(b.openDate??"9999"));
  if(active==="listed") rows.sort((a,b)=>(b.listingDate??"").localeCompare(a.listingDate??""));
  if(!rows.length){stack.innerHTML='<div class="empty">Nothing here right now — check the other tabs.</div>';return;}
  stack.innerHTML=rows.map(ipo=>{
    const cdChip=(ipo.status==="open"&&ipo.closeDate&&daysTo(ipo.closeDate)>=0)?'<span class="chip cd">closes '+(daysTo(ipo.closeDate)===0?'today':'in '+daysTo(ipo.closeDate)+'d')+'</span>':'';
    return '<article class="card"><div class="glare"></div>'+
      '<div class="sec who"><div class="sec-label">Issue</div>'+
        '<div class="co-name">'+ipo.company+'</div>'+
        '<div class="co-meta">'+(ipo.sector&&ipo.sector!=="—"?ipo.sector+' · ':'')+ipo.exchange+'</div>'+
        '<div class="chips"><span class="chip '+ipo.status+'">'+ipo.status+'</span>'+(ipo.board==="SME"?'<span class="chip sme">SME</span>':'')+cdChip+'</div>'+
        timelineHTML(ipo)+
      '</div>'+
      pulseHTML(ipo)+
      factsHTML(ipo)+
    '</article>';
  }).join("");
  animate();
}

function animate(){
  const cards=[...document.querySelectorAll(".card")];
  cards.forEach((c,i)=>{
    c.style.animationDelay=(Math.min(i,10)*70)+"ms";
    requestAnimationFrame(()=>c.classList.add("in"));
    if(canHover && !reduceMotion) tilt(c);
  });
  setTimeout(()=>{
    document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%");
  }, 120);
  if(!reduceMotion){
    document.querySelectorAll("[data-count]").forEach(el=>{
      const target=parseFloat(el.dataset.count), suf=el.dataset.suffix||"", pre=el.dataset.prefix||"", dec=parseInt(el.dataset.dec||"1");
      const t0=performance.now(), dur=900;
      const step=(now)=>{
        const p=Math.min(1,(now-t0)/dur), ease=1-Math.pow(1-p,3);
        el.textContent=pre+(target*ease).toFixed(dec)+suf;
        if(p<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }else{
    document.querySelectorAll("[data-count]").forEach(el=>{
      el.textContent=(el.dataset.prefix||"")+parseFloat(el.dataset.count).toFixed(parseInt(el.dataset.dec||"1"))+(el.dataset.suffix||"");
    });
  }
}

/* 3D tilt — gentler angles for wide rows */
function tilt(card){
  let raf=null;
  card.addEventListener("pointermove",e=>{
    if(raf) return;
    raf=requestAnimationFrame(()=>{
      const r=card.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
      const rx=(py-.5)*-4, ry=(px-.5)*3;
      card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) translateY(-3px)`;
      card.style.setProperty("--gx",(px*100)+"%");
      card.style.setProperty("--gy",(py*100)+"%");
      raf=null;
    });
  });
  card.addEventListener("pointerleave",()=>{
    card.style.transform="rotateX(0) rotateY(0) translateY(0)";
    card.style.transition="transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease";
    setTimeout(()=>card.style.transition="box-shadow .25s ease",500);
  });
}

load();
</script>
